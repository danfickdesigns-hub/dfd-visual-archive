<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DFD Visual Archive</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#0a84ff;--orange:#e56b2f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:#fafafc;overflow:auto}
.brand{font-weight:780;font-size:20px;letter-spacing:-.035em;padding:0 8px}.small{color:var(--muted);font-size:12px;padding:4px 8px 18px}
.nav-title{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.09em;color:#999;padding:18px 9px 6px}
.nav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 9px;margin:2px 0}.nav:hover,.nav.on{background:#e9e9ee}.nav span{float:right;color:#8e8e93;font-size:11px}
.main{min-width:0}.bar{position:sticky;top:0;z-index:8;padding:14px 20px;background:rgba(245,245,247,.92);backdrop-filter:blur(20px);display:flex;gap:8px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:180px;border:0;border-radius:11px;background:#fff;padding:10px 12px;outline:none}.sel,.btn{border:0;border-radius:10px;background:#fff;padding:9px 10px}
.mobile-mode{display:none}.content{padding:18px 20px 110px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:10px}.title{font-size:28px;font-weight:760;letter-spacing:-.04em}.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative;transition:.15s}.card:hover{box-shadow:0 10px 30px rgba(0,0,0,.09);transform:translateY(-1px)}.card.pick{outline:3px solid var(--blue)}
.thumb{aspect-ratio:1;background:#ececf0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.fallback{font-weight:800;color:#aaa;font-size:22px}
.tick{position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:50%;border:1px solid #bbb;background:rgba(255,255,255,.92);color:transparent;font-weight:800}.pick .tick{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge{position:absolute;left:8px;top:8px;background:rgba(20,20,22,.72);color:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:700}.badge.scout{background:rgba(229,107,47,.92)}
.meta{padding:10px 11px 12px}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:8px;align-items:center;background:rgba(25,25,27,.93);color:#fff;padding:10px;border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.25);z-index:10;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}.tray.show{display:flex}.tray button{border:0;border-radius:9px;padding:8px 10px;background:#38383c;color:#fff}.tray .white{background:#fff;color:#111}.tray strong{padding:0 5px;white-space:nowrap}
.drawer{position:fixed;right:-450px;top:0;width:min(430px,95vw);height:100vh;background:rgba(255,255,255,.98);backdrop-filter:blur(24px);box-shadow:-20px 0 50px rgba(0,0,0,.16);z-index:20;transition:.22s;overflow:auto}.drawer.open{right:0}.dhead{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.dhead button{border:0;border-radius:50%;width:30px;height:30px}.dbody{padding:16px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.hero{aspect-ratio:1;background:#f0f0f2;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero img{width:100%;height:100%;object-fit:contain}.dtitle{font-size:22px;font-weight:760;line-height:1.1;margin-top:15px}.did,.label{font-size:11px;color:var(--muted)}.section{margin-top:17px}.label{text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:5px}.value{font-size:13px;line-height:1.5}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:#ededf2;padding:5px 7px;border-radius:999px}.actions{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 11px}.primary{background:var(--blue);color:#fff}.scout-note{background:#fff4ed;border-radius:10px;padding:10px 11px;font-size:12px;color:#784329;margin-top:12px}
@media(max-width:720px){
 .app{grid-template-columns:1fr}.side{display:none}.bar{padding:10px;gap:7px;flex-wrap:wrap}.search{order:1;flex-basis:100%;font-size:16px}.mobile-mode{display:block;order:2;flex:1}.bar #fam,.bar #typ{order:2;flex:1;min-width:0}.bar #clear{order:2}.content{padding:12px 10px 105px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.title{font-size:23px}.head{align-items:flex-start;flex-direction:column}.head>.status:last-child{display:none}.meta{padding:9px}.name{font-size:12px}.sub{font-size:10px}.drawer{width:100vw}.tray{bottom:calc(9px + env(safe-area-inset-bottom));width:calc(100vw - 18px)}}
</style></head><body>
